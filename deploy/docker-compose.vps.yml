# ZENOVA School ERP — VPS Deployment (pre-built images)
# Images built via school-erp/build.sh, loaded from tar.gz
services:
  nginx:
    image: nginx:1.26-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-data:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-zenova}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-zenova_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zenova} -d ${DB_NAME:-zenova_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: zenova/backend:${ZENOVA_VERSION:-latest}
    expose:
      - "8000"
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-zenova}:${DB_PASSWORD}@db:5432/${DB_NAME:-zenova_prod}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      ENVIRONMENT: "production"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      ALLOWED_ORIGINS: "https://${DOMAIN},http://localhost:3000"
      CORS_ORIGINS: "https://${DOMAIN},http://localhost:3000"
      ZENOVA_LICENSE_KEY: ${ZENOVA_LICENSE_KEY:-}
      ZENOVA_LICENSE_SERVER: ${ZENOVA_LICENSE_SERVER:-https://superadmin.free.nf}
      SCHOOL_ID: ${SCHOOL_ID:-}
    volumes:
      - server-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: zenova/frontend:${ZENOVA_VERSION:-latest}
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: "${DOMAIN_URL}/api/v1"
      NEXT_PUBLIC_WS_URL: "wss://${DOMAIN}/ws"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  sync-worker:
    image: zenova/backend:${ZENOVA_VERSION:-latest}
    entrypoint: ["python", "-m", "app.workers.sync_worker", "30"]
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-zenova}:${DB_PASSWORD}@db:5432/${DB_NAME:-zenova_prod}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      ENVIRONMENT: "production"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 43200; done'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-data:/var/www/certbot
    profiles: ["ssl"]
    restart: unless-stopped

  backup-worker:
    image: postgres:16-alpine
    entrypoint: |
      sh -c 'while true; do \
        pg_dump "postgresql://${DB_USER:-zenova}:${DB_PASSWORD}@db:5432/${DB_NAME:-zenova_prod}" \
        --no-owner --no-acl -f /backups/zenova_$$(date +%%Y%%m%%d_%%H%%M%%S).sql && \
        find /backups -name "*.sql" -mtime +7 -delete; \
        sleep 86400; \
      done'
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    environment:
      DB_USER: ${DB_USER:-zenova}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_NAME: ${DB_NAME:-zenova_prod}
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  server-data:
  certbot-data:
  certbot-conf:
