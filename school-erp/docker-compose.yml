# ZENOVA School ERP — Customer Deployment
# Pre-built images — no source code required.
# Usage: docker compose up -d

x-common-env: &common-env
  ENVIRONMENT: "${ENVIRONMENT:-production}"

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/zenova.conf:ro
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: 0.25

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenova_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_DB: zenova_db
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenova_user -d zenova_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: zenova/backend:${ZENOVA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql://zenova_user:${DB_PASSWORD:?}@db:5432/zenova_db"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY}"
      ZENOVA_LICENSE_KEY: "${ZENOVA_LICENSE_KEY:?Set ZENOVA_LICENSE_KEY}"
      ZENOVA_LICENSE_SERVER: "${ZENOVA_LICENSE_SERVER:-https://superadmin.free.nf}"
      SCHOOL_ID: "${SCHOOL_ID:?Set SCHOOL_ID}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
    volumes:
      - backend_data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: zenova/frontend:${ZENOVA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_URL: "${API_URL:-http://localhost:8000/api/v1}"
      NEXT_PUBLIC_WS_URL: "${WS_URL:-ws://localhost:8000/ws}"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
